<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer Hexagon Nodes -->
  <polygon points="50,15 80,32 80,68 50,85 20,68 20,32" stroke="#09284C" stroke-width="6" stroke-linejoin="round" fill="none"/>
  <!-- Connecting Inner Bonds -->
  <line x1="50" y1="15" x2="50" y2="40" stroke="#164B73" stroke-width="4"/>
  <line x1="80" y1="32" x2="58" y2="45" stroke="#164B73" stroke-width="4"/>
  <line x1="80" y1="68" x2="58" y2="55" stroke="#164B73" stroke-width="4"/>
  <line x1="50" y1="85" x2="50" y2="60" stroke="#164B73" stroke-width="4"/>
  <line x1="20" y1="68" x2="42" y2="55" stroke="#164B73" stroke-width="4"/>
  <line x1="20" y1="32" x2="42" y2="45" stroke="#164B73" stroke-width="4"/>
  
  <!-- Outer Nodes -->
  <circle cx="50" cy="15" r="8" fill="#164B73" stroke="#F7F5EF" stroke-width="2"/>
  <circle cx="80" cy="32" r="8" fill="#164B73" stroke="#F7F5EF" stroke-width="2"/>
  <circle cx="80" cy="68" r="8" fill="#164B73" stroke="#F7F5EF" stroke-width="2"/>
  <circle cx="50" cy="85" r="8" fill="#164B73" stroke="#F7F5EF" stroke-width="2"/>
  <circle cx="20" cy="68" r="8" fill="#164B73" stroke="#F7F5EF" stroke-width="2"/>
  <circle cx="20" cy="32" r="8" fill="#164B73" stroke="#F7F5EF" stroke-width="2"/>

  <!-- Center Active Atom / Core (Energy/Creativity in Orange) -->
  <circle cx="50" cy="50" r="12" fill="#F4A261" stroke="#FFFFFF" stroke-width="2"/>
</svg>